name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ruby shellcheck
      - name: Check shell scripts
        run: shellcheck scripts/bootstrap.sh tests/*.sh
      - name: Run repository tests
        run: |
          sh tests/bootstrap_test.sh
          sh tests/repository_test.sh
      - name: Type-check Railway IaC
        run: bunx tsc --noEmit --moduleResolution bundler --module preserve --target es2022 .railway/railway.ts

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag personal-agent:test .
      - name: Verify Hermes version command
        run: docker run --rm personal-agent:test --version
